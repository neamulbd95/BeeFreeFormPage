<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Beefree SDK - Custom Form Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #f5f5f5; }
    input, button, select, textarea { font-family: inherit; }

    #bee-plugin-container {
      position: absolute;
      top: 5px; bottom: 5px; left: 5px; right: 5px;
    }

    /* ── Modal overlay ── */
    .fb-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .fb-modal {
      width: 920px; max-width: 96vw; max-height: 92vh;
      display: flex; flex-direction: column;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      background: white;
    }

    /* ── Sidebar ── */
    .fb-sidebar { width: 190px; flex-shrink: 0; overflow-y: auto; }

    /* ── Editor scroll ── */
    .fb-editor { flex: 1; overflow-y: auto; }

    /* ── Field type palette buttons ── */
    .field-type-btn {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; margin-bottom: 4px;
      background: white; border: 1px solid #dee2e6; border-radius: 7px;
      cursor: pointer; font-size: 13px; color: #374151; font-weight: 500;
      text-align: left; transition: all 0.12s;
    }
    .field-type-btn:hover        { border-color: #818CF8; color: #4F46E5; background: #EEF2FF; }
    .field-type-btn.submit-type:hover { border-color: #34D399; color: #059669; background: #ECFDF5; }
    .field-type-btn:disabled     { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .btn-icon {
      width: 22px; height: 22px; border-radius: 5px;
      background: #f1f5f9; display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700;
      color: #64748B; flex-shrink: 0;
    }

    /* ── Type badges ── */
    .type-badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .type-text, .type-password { background: #EEF2FF; color: #6366F1; }
    .type-email                { background: #FEF3C7; color: #D97706; }
    .type-number               { background: #E0F2FE; color: #0284C7; }
    .type-textarea             { background: #F0FDF4; color: #16A34A; }
    .type-select, .type-radio        { background: #FDF4FF; color: #9333EA; }
    .type-multiselect                 { background: #ECFEFF; color: #0891B2; }
    .required-badge { font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; background: #FEF2F2; color: #DC2626;
      letter-spacing: 0.04em; margin-left: 6px; }
    .type-submit               { background: #ECFDF5; color: #059669; }

    /* ── Field card hover ── */
    .field-card:hover { border-color: #adb5bd !important; }

    /* ── Reorder / remove buttons ── */
    .action-btn {
      background: white; border: 1px solid #dee2e6; border-radius: 5px;
      padding: 3px 8px; cursor: pointer; font-size: 12px;
      color: #6c757d; transition: all 0.12s; line-height: 1.5;
    }
    .action-btn:hover        { border-color: #818CF8; color: #4F46E5; }
    .action-btn:disabled     { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .action-btn.delete:hover { border-color: #FCA5A5; color: #EF4444; background: #FEF2F2; }

    /* ── Config label inside field cards ── */
    .config-label {
      display: block; margin-bottom: 4px;
      font-size: 10px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* ── Options editor ── */
    .options-section { border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 8px; }
    .add-option-btn {
      font-size: 11px; font-weight: 500; padding: 3px 9px;
      background: white; border: 1px solid #818CF8;
      color: #6366F1; border-radius: 4px; cursor: pointer; transition: background 0.12s;
    }
    .add-option-btn:hover { background: #EEF2FF; }
    .drag-handle { color: #CBD5E1; font-size: 14px; -webkit-user-select: none; user-select: none; }
    .option-input {
      flex: 1; padding: 5px 9px; border: 1px solid #dee2e6;
      border-radius: 5px; font-size: 12px; color: #374151; outline: none;
    }
    .option-input:focus { border-color: #818CF8; }
    .remove-opt-btn {
      background: none; border: none; color: #CBD5E1;
      cursor: pointer; font-size: 16px; padding: 0 3px; line-height: 1; transition: color 0.12s;
    }
    .remove-opt-btn:hover { color: #EF4444; }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; text-align: center;
      border: 2px dashed #CBD5E1; border-radius: 10px;
      background: white; min-height: 200px;
    }

    /* ── Modal header elements ── */
    .fb-modal-title { font-weight: 600; color: #1E293B; }
    .fb-close-btn   { width: 30px; height: 30px; padding: 0; font-size: 16px; }

    /* ── Modal body flex container ── */
    .fb-body { min-height: 0; }

    /* ── Editor background ── */
    .fb-editor { background: #F8FAFC; }

    /* ── Sidebar section labels ── */
    .sidebar-section-label { font-size: 10px; letter-spacing: .08em; }

    /* ── Form meta section label ── */
    .form-meta-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; }

    /* ── Empty state elements ── */
    .empty-icon  { font-size: 38px; margin-bottom: 14px; }
    .empty-title { font-size: 15px; }

    /* ── Footer actions gap ── */
    .footer-actions { gap: 8px; }

    /* ── JS-generated card internals ── */
    .card-actions      { gap: 3px; }
    .options-header-label {
      font-size: 10px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .option-row-inner  { gap: 5px; }
    .required-label    { gap: 6px; cursor: pointer; font-size: 13px; color: #374151; }
    .required-checkbox { accent-color: #6366F1; cursor: pointer; }

    /* ── Bootstrap primary colour override (indigo) ── */
    .btn-primary           { background-color: #6366F1 !important; border-color: #6366F1 !important; }
    .btn-primary:hover     { background-color: #4F46E5 !important; border-color: #4F46E5 !important; }
    .btn-primary:focus     { box-shadow: 0 0 0 0.2rem rgba(99,102,241,0.35) !important; }
    .btn-primary:disabled  { background-color: #A5B4FC !important; border-color: #A5B4FC !important; }

    /* ── Validation toast ── */
    #validation-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA;
      padding: 12px 20px 12px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 500; z-index: 99999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      display: flex; align-items: center; gap: 10px; max-width: 480px;
    }
    #validation-toast .toast-close {
      margin-left: 12px; cursor: pointer; color: #FCA5A5;
      font-size: 16px; line-height: 1; background: none; border: none; padding: 0;
    }
    #validation-toast .toast-close:hover { color: #DC2626; }
  </style>
</head>

<body>

  <div id="bee-plugin-container"></div>

  <!-- ── Validation Toast ── -->
  <div id="validation-toast" style="display:none">
    <span>⛔</span>
    <span id="validation-toast-msg"></span>
    <button type="button" class="toast-close" onclick="hideValidationToast()" title="Dismiss">✕</button>
  </div>

  <!-- ── Form Builder Modal ── -->
  <div id="form-modal" class="fb-overlay" style="display:none">
    <div class="fb-modal">

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom bg-white flex-shrink-0">
        <h6 class="mb-0 fb-modal-title">Form Builder</h6>
        <button type="button" class="btn btn-sm btn-light fb-close-btn" onclick="cancelForm()" title="Cancel">✕</button>
      </div>

      <!-- Body -->
      <div class="d-flex flex-grow-1 overflow-hidden fb-body">

        <!-- Left: field type palette -->
        <div class="fb-sidebar border-right bg-light p-3">
          <p class="text-uppercase text-muted font-weight-bold mb-2 sidebar-section-label">Basic Fields</p>

          <button type="button" class="field-type-btn" onclick="addField('text')">
            <span class="btn-icon">T</span> Text
          </button>
          <button type="button" class="field-type-btn" onclick="addField('email')">
            <span class="btn-icon">@</span> Email
          </button>
          <button type="button" class="field-type-btn" onclick="addField('number')">
            <span class="btn-icon">#</span> Number
          </button>
          <button type="button" class="field-type-btn" onclick="addField('textarea')">
            <span class="btn-icon">¶</span> Long Text
          </button>
          <button type="button" class="field-type-btn" onclick="addField('password')">
            <span class="btn-icon">••</span> Password
          </button>

          <hr class="my-2" />
          <p class="text-uppercase text-muted font-weight-bold mb-2 sidebar-section-label">Choice Fields</p>
          <button type="button" class="field-type-btn" onclick="addField('select')">
            <span class="btn-icon">▾</span> Dropdown
          </button>
          <button type="button" class="field-type-btn" onclick="addField('multiselect')">
            <span class="btn-icon">▾▾</span> Multi-Select
          </button>
          <button type="button" class="field-type-btn" onclick="addField('radio')">
            <span class="btn-icon">◉</span> Radio Group
          </button>

          <hr class="my-2" />
          <p class="text-uppercase text-muted font-weight-bold mb-2 sidebar-section-label">Action</p>
          <button type="button" id="add-submit-btn" class="field-type-btn submit-type" onclick="addField('submit')">
            <span class="btn-icon">→</span> Submit
          </button>
        </div>

        <!-- Right: form editor -->
        <div class="fb-editor p-4">

          <!-- Form meta -->
          <div class="card mb-3">
            <div class="card-body py-3">
              <p class="text-uppercase text-muted mb-2 form-meta-label">Form Settings</p>
              <div class="row">
                <div class="col-6">
                  <label class="small font-weight-bold text-secondary mb-1">Form Title</label>
                  <input id="form-title" type="text" class="form-control form-control-sm"
                    placeholder="e.g. Contact Us" />
                </div>
                <div class="col-6">
                  <label class="small font-weight-bold text-secondary mb-1">Description</label>
                  <input id="form-description" type="text" class="form-control form-control-sm"
                    placeholder="Short description" />
                </div>
              </div>
            </div>
          </div>

          <!-- Field cards -->
          <div id="fields-container"></div>

          <!-- Empty state -->
          <div id="empty-state" class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="font-weight-bold text-secondary empty-title">No fields added yet</div>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <div class="d-flex align-items-center justify-content-between px-4 py-3 border-top bg-white flex-shrink-0">
        <span class="text-muted small" id="field-count">0 fields</span>
        <div class="d-flex footer-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="cancelForm()">Cancel</button>
          <button type="button" class="btn btn-primary btn-sm" id="save-btn" onclick="saveForm()">Save Form</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://app-rsrc.getbee.io/plugin/BeePlugin.js"></script>
  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let formFields          = [];
    let resolveForm         = null;
    let rejectForm          = null;
    let currentFormId       = null;
    let currentTemplateJson = null;

    // ─── Validation helpers ───────────────────────────────────────────────────
    function countFormsOnPage() {
      if (!currentTemplateJson) return 0;
      const hits = currentTemplateJson.match(/"name"\s*:\s*"form_id"/g);
      return hits ? hits.length : 0;
    }

    let _toastTimer = null;
    function showValidationToast(msg) {
      document.getElementById('validation-toast-msg').textContent = msg;
      const el = document.getElementById('validation-toast');
      el.style.display = 'flex';
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(hideValidationToast, 5000);
    }
    function hideValidationToast() {
      document.getElementById('validation-toast').style.display = 'none';
    }

    // ─── Field defaults ───────────────────────────────────────────────────────
    const MULTISELECT_COLS = 3; // max checkboxes per row in the BeeFree canvas

    const FIELD_DEFAULTS = {
      text:     { label: 'Text Input',    attributes: { required: false, placeholder: '' } },
      email:    { label: 'Email Address', attributes: { required: false, placeholder: '' } },
      number:   { label: 'Number',        attributes: { required: false, placeholder: '' } },
      textarea: { label: 'Message',       attributes: { required: false, placeholder: '' } },
      password: { label: 'Password',      attributes: { required: false, placeholder: '' } },
      select: {
        label: 'Choose an option', attributes: { required: false },
        options: [
          { type: 'option', label: 'Option 1', value: 'Option 1' },
          { type: 'option', label: 'Option 2', value: 'Option 2' },
        ]
      },
      multiselect: {
        label: 'Choose options', attributes: { required: false },
        options: [
          { type: 'option', label: 'Option 1', value: 'Option 1' },
          { type: 'option', label: 'Option 2', value: 'Option 2' },
          { type: 'option', label: 'Option 3', value: 'Option 3' },
        ]
      },
      radio: {
        label: 'Choose one', attributes: { required: false },
        options: [
          { type: 'option', label: 'Option A', value: 'Option A' },
          { type: 'option', label: 'Option B', value: 'Option B' },
        ]
      },
      submit: { label: '', attributes: { value: 'Submit', name: 'submit_button' } },
    };

    // ─── Field operations ─────────────────────────────────────────────────────
    function uid(type) {
      return type + '_' + Math.random().toString(36).slice(2, 7);
    }

    function addField(type) {
      const defaults = FIELD_DEFAULTS[type];
      if (!defaults) return;
      if (type === 'submit' && formFields.some(f => f.type === 'submit')) {
        showValidationToast('Only one Submit button is allowed per form.');
        return;
      }
      formFields.push({
        id:         uid(type),
        type,
        label:      defaults.label,
        attributes: JSON.parse(JSON.stringify(defaults.attributes)),
        options:    defaults.options ? JSON.parse(JSON.stringify(defaults.options)) : undefined,
      });
      renderFields();
    }

    function removeField(id) {
      formFields = formFields.filter(f => f.id !== id);
      renderFields();
    }

    function moveField(id, dir) {
      const i = formFields.findIndex(f => f.id === id);
      const j = i + dir;
      if (j < 0 || j >= formFields.length) return;
      [formFields[i], formFields[j]] = [formFields[j], formFields[i]];
      renderFields();
    }

    function setLabel(id, val) {
      const f = formFields.find(f => f.id === id);
      if (f) f.label = val;
    }

    function setAttr(id, key, val) {
      const f = formFields.find(f => f.id === id);
      if (f) { 
        if (!f.attributes) {
          f.attributes = {}; 
          f.attributes[key] = val;
        } 
      }
    }

    function addOption(id) {
      const f = formFields.find(f => f.id === id);
      if (!f || !f.options) return;
      const n = f.options.length + 1;
      f.options.push({ type: 'option', label: 'Option ' + n, value: 'Option ' + n });
      renderFields();
    }

    function removeOption(id, idx) {
      const f = formFields.find(f => f.id === id);
      if (f && f.options) { f.options.splice(idx, 1); renderFields(); }
    }

    function updateOptionLabel(id, idx, val) {
      const f = formFields.find(f => f.id === id);
      if (f && f.options && f.options[idx]) {
        f.options[idx].label = val;
        f.options[idx].value = val;
      }
    }

    // ─── Rendering ────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderFields() {
      const container = document.getElementById('fields-container');
      const empty     = document.getElementById('empty-state');
      const counter   = document.getElementById('field-count');

      counter.textContent = formFields.length + (formFields.length === 1 ? ' field' : ' fields');

      // Disable the Submit palette button when a submit field already exists
      const submitBtn = document.getElementById('add-submit-btn');
      if (submitBtn) submitBtn.disabled = formFields.some(f => f.type === 'submit');

      if (formFields.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'flex';
        return;
      }
      empty.style.display = 'none';
      container.innerHTML = '';
      formFields.forEach((field, i) => container.appendChild(buildCard(field, i)));
    }

    function buildCard(field, index) {
      const isFirst    = index === 0;
      const isLast     = index === formFields.length - 1;
      const isSubmit   = field.type === 'submit';
      const hasHolder  = ['text','email','number','textarea','password'].includes(field.type);
      const hasOptions = ['select','multiselect','radio'].includes(field.type);

      const optionsBlock = hasOptions ? `
        <div class="options-section">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="options-header-label">Options</span>
            <button class="add-option-btn" onclick="addOption('${field.id}')">+ Add Option</button>
          </div>
          <div>
            ${(field.options || []).map((opt, i) => `
              <div class="d-flex align-items-center mb-1 option-row-inner">
                <span class="drag-handle">⠿</span>
                <input class="option-input" type="text" value="${esc(opt.label)}"
                  oninput="updateOptionLabel('${field.id}', ${i}, this.value)" />
                <button class="remove-opt-btn" onclick="removeOption('${field.id}', ${i})" title="Remove">×</button>
              </div>`).join('')}
          </div>
        </div>` : '';

      const bodyContent = isSubmit
        ? `<div>
             <label class="config-label">Button Text</label>
             <input type="text" class="form-control form-control-sm" value="${esc(field.attributes?.value || 'Submit')}"
               oninput="setAttr('${field.id}', 'value', this.value)" />
           </div>`
        : `<div class="${hasHolder ? 'row' : ''}">
             <div class="${hasHolder ? 'col-6' : ''}">
               <label class="config-label">Label</label>
               <input type="text" class="form-control form-control-sm" value="${esc(field.label)}"
                 oninput="setLabel('${field.id}', this.value)" />
             </div>
             ${hasHolder ? `
             <div class="col-6">
               <label class="config-label">Placeholder</label>
               <input type="text" class="form-control form-control-sm" value="${esc(field.attributes?.placeholder || '')}"
                 oninput="setAttr('${field.id}', 'placeholder', this.value)" />
             </div>` : ''}
           </div>
           <div class="d-flex align-items-center mt-2">
             <label class="mb-0 d-flex align-items-center required-label">
               <input type="checkbox" class="required-checkbox" ${field.attributes?.required ? 'checked' : ''}
                 onchange="setAttr('${field.id}', 'required', this.checked); renderFields()" />
               Required field
             </label>
           </div>
           ${optionsBlock}`;

      const div = document.createElement('div');
      div.className = 'field-card card mb-2';
      div.innerHTML = `
        <div class="card-header d-flex align-items-center justify-content-between py-2 px-3">
          <div class="d-flex align-items-center">
            <span class="type-badge type-${field.type}">${field.type}</span>
            ${field.attributes?.required ? '<span class="required-badge">* Required</span>' : ''}
          </div>
          <div class="d-flex card-actions">
            <button class="action-btn" onclick="moveField('${field.id}', -1)" ${isFirst ? 'disabled' : ''} title="Move up">↑</button>
            <button class="action-btn" onclick="moveField('${field.id}',  1)" ${isLast  ? 'disabled' : ''} title="Move down">↓</button>
            <button class="action-btn delete" onclick="removeField('${field.id}')" title="Remove field">✕</button>
          </div>
        </div>
        <div class="card-body py-3 px-3">${bodyContent}</div>`;
      return div;
    }

    // ─── Build Beefree form structure ─────────────────────────────────────────
    function buildFormStructure(formId) {
      const title       = document.getElementById('form-title').value.trim();
      const description = document.getElementById('form-description').value.trim();

      const fields = {};
      const layout = [];

      fields['form_id'] = {
        type:                   'hidden',
        label:                  '',
        removeFromLayout:       false,
        canBeRemovedFromLayout: false,
        canBeModified:          false,
        attributes:             { name: 'form_id', value: formId },
      };
      layout.push(['form_id']);

      // Collect labels for non-submit visible fields to embed in the form
      const labelMap = {};

      formFields.forEach(f => {
        if (f.type === 'multiselect') {
          // Render each option as an individual checkbox field in BeeFree.
          // All share the same name (f.id) so the browser submits them as a repeated key.
          // Field IDs follow {groupId}__cb_{index} so loadExistingForm can reconstruct the group.
          labelMap[f.id] = f.label || '';

          // Checkbox fields render their `label` inline next to the input (unlike
          // select/radio, which show it above the control), so the group's own label
          // needs its own visible `label`-type field or it never appears on the canvas.
          const labelId = `${f.id}__label`;
          fields[labelId] = {
            type:                   'label',
            label:                  f.label || '',
            canBeRemovedFromLayout: true,
            removeFromLayout:       false,
            canBeModified:          true,
            attributes:             {},
          };
          layout.push([labelId]);

          const cbIds = [];
          (f.options || []).forEach((opt, i) => {
            const cbId = `${f.id}__cb_${i}`;
            fields[cbId] = {
              type:                   'checkbox',
              label:                  opt.label || '',
              canBeRemovedFromLayout: true,
              removeFromLayout:       false,
              canBeModified:          true,
              attributes: {
                name:         f.id,
                value:        opt.value || '',
                'data-label': f.label || '',
              },
            };
            cbIds.push(cbId);
          });
          // Pack checkboxes into rows of MULTISELECT_COLS
          for (let i = 0; i < cbIds.length; i += MULTISELECT_COLS) {
            layout.push(cbIds.slice(i, i + MULTISELECT_COLS));
          }
          return; // skip the generic path below
        }

        const attrs = { ...f.attributes };
        // Omit required when false — HTML treats any presence of the attribute as "required",
        // so required="false" would still enforce validation.
        if (!attrs.required) delete attrs.required;
        if (f.type !== 'submit') {
          attrs['data-label'] = f.label || '';
          labelMap[f.id] = f.label || '';
        }

        const def = {
          type:                   f.type,
          label:                  f.label || '',
          canBeRemovedFromLayout: true,
          removeFromLayout:       false,
          canBeModified:          true,
          attributes:             attrs,
        };
        if (f.options) def.options = f.options.map(o => ({ ...o }));
        fields[f.id] = def;
        layout.push([f.id]);
      });

      // Hidden field that carries all labels so submissions don't need the registry to resolve them.
      // Base64-encoded to avoid double-quote characters breaking the HTML value attribute.
      fields['__field_labels'] = {
        type:                   'hidden',
        label:                  '',
        removeFromLayout:       false,
        canBeRemovedFromLayout: false,
        canBeModified:          false,
        attributes:             { name: '__field_labels', value: btoa(JSON.stringify(labelMap)) },
      };
      layout.push(['__field_labels']);

      console.log('Built form structure:', { title, description, fields, layout });

      return {
        structure: {
          title,
          description,
          fields,
          layout,
          attributes: {
            'accept-charset': 'UTF-8',
            action:           'http://localhost:5000/api/form-submit',
            autocomplete:     'on',
            enctype:          'application/x-www-form-urlencoded',
            method:           'post',
            novalidate:       false,
            target:           '_self',
          }
        }
      };
    }

    // ─── Load existing form (when user re-opens editor) ───────────────────────
    function loadExistingForm(structure) {
      document.getElementById('form-title').value       = structure.title       || '';
      document.getElementById('form-description').value = structure.description || '';

      const idField = (structure.fields || {})['form_id'];
      currentFormId = idField?.attributes?.value || null;

      formFields = [];
      const seenGroups = new Set();

      // A row can hold multiple field IDs (multiselect checkboxes are packed
      // MULTISELECT_COLS-per-row), so every ID in the row must be visited —
      // not just row[0] — or later options in a group get silently dropped.
      (structure.layout || []).forEach(row => row.forEach(id => {
        if (id === 'form_id' || id === '__field_labels') return;
        const def = (structure.fields || {})[id];
        if (!def || def.removeFromLayout) return;

        // Group-label helper field for a multiselect — regenerated from f.label on
        // every save, not a real field, so skip it when reconstructing formFields.
        if (def.type === 'label') return;

        // Multiselect checkbox group — IDs follow {groupId}__cb_{index}
        if (def.type === 'checkbox' && id.includes('__cb_')) {
          const groupId = id.split('__cb_')[0];
          if (!seenGroups.has(groupId)) {
            seenGroups.add(groupId);
            formFields.push({
              id:         groupId,
              type:       'multiselect',
              label:      def.attributes?.['data-label'] || groupId,
              attributes: { required: false },
              options:    [],
            });
          }
          formFields.find(f => f.id === groupId).options.push({
            type:  'option',
            label: def.label || '',
            value: def.attributes?.value || '',
          });
          return;
        }

        formFields.push({
          id,
          type:       def.type,
          label:      def.label || '',
          attributes: { ...(def.attributes || {}) },
          options:    def.options ? def.options.map(o => ({ ...o })) : undefined,
        });
      }));

      renderFields();
    }

    // ─── Modal controls ───────────────────────────────────────────────────────
    function resetForm() {
      formFields    = [];
      currentFormId = null;
      document.getElementById('form-title').value       = '';
      document.getElementById('form-description').value = '';
      renderFields();
    }

    function openModal() {
      document.getElementById('form-modal').style.display = 'flex';
    }

    async function saveForm() {
      if (formFields.length === 0) {
        alert('Please add at least one field before saving.');
        return;
      }
      const hasSubmit = formFields.some(f => f.type === 'submit');
      if (!hasSubmit) {
        if (!confirm('No Submit button found — add one automatically?')) return;
        addField('submit');
      }

      const saveBtn = document.getElementById('save-btn');
      saveBtn.textContent = 'Saving…';
      saveBtn.disabled    = true;

      try {
        const res = await fetch('http://localhost:3001/api/forms/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            formId:      currentFormId,
            title:       document.getElementById('form-title').value.trim(),
            description: document.getElementById('form-description').value.trim(),
            fieldMeta:   formFields.map(f => ({ id: f.id, type: f.type, label: f.label })),
          }),
        });

        if (!res.ok) throw new Error('Server responded with ' + res.status);
        const { formId } = await res.json();
        currentFormId = formId;

        const structure = buildFormStructure(formId);
        if (resolveForm) {
          resolveForm(structure);
          resolveForm = null;
          rejectForm  = null;
        }
        document.getElementById('form-modal').style.display = 'none';
      } catch (err) {
        console.error('Form registration failed:', err);
        alert('Could not reach the server. Make sure proxy-server.js is running on port 3001.');
      } finally {
        saveBtn.textContent = 'Save Form';
        saveBtn.disabled    = false;
      }
    }

    function cancelForm() {
      if (rejectForm) {
        rejectForm();
        resolveForm = null;
        rejectForm  = null;
      }
      document.getElementById('form-modal').style.display = 'none';
    }

    // ─── Beefree config ───────────────────────────────────────────────────────
    const emptyForm = {
      structure: {
        title: '', description: '', fields: {}, layout: [],
        attributes: {
          'accept-charset': 'UTF-8',
          action:           'http://localhost:5000/api/form-submit',
          autocomplete:     'on',
          enctype:          'application/x-www-form-urlencoded',
          method:           'post',
          novalidate:       false,
          target:           '_self',
        }
      }
    };

    const beeConfig = {
      container:    'bee-plugin-container',
      language:     'en-US',
      trackChanges: true,
      defaultForm:  emptyForm,

      contentDialog: {
        manageForm: {
          label: 'Design Form',
          handler: async (resolve, reject, args) => {
            // args carries form data directly: args.layout, args.fields, args.title …
            // (there is no args.structure wrapper)
            const hasFields = args && Array.isArray(args.layout) && args.layout.length > 0;

            // Only block when the user is dropping a *new* form block onto the page.
            // Editing an existing block (hasFields === true) must always be allowed.
            if (!hasFields && countFormsOnPage() > 0) {
              reject();
              showValidationToast('Only one form is allowed per page. Click the existing form block to edit it.');
              return;
            }

            resolveForm = resolve;
            rejectForm  = reject;

            if (hasFields) loadExistingForm(args);
            else           resetForm();

            openModal();
          }
        }
      },

      onChange: (jsonFile) => {
        currentTemplateJson = jsonFile;
        localStorage.setItem('form-builder.autosave', jsonFile);
      },
      onSave: (jsonFile, htmlFile) => {
        const a = Object.assign(document.createElement('a'), {
          href:     URL.createObjectURL(new Blob([htmlFile], { type: 'text/html' })),
          download: 'form-page.html',
        });
        a.click();
      },
      onSaveAsTemplate: (jsonFile) => {
        const a = Object.assign(document.createElement('a'), {
          href:     URL.createObjectURL(new Blob([jsonFile], { type: 'application/json' })),
          download: 'form-template.json',
        });
        a.click();
      },
      onAutoSave: (jsonFile) => {
        localStorage.setItem('form-builder.autosave', jsonFile);
      },
      onError: (error) => {
        console.error('Bee Error:', error);
        if (error.code === 5101 || error.code === 5102) {
          getBeeToken(token => {
            if (error.code === 5101) bee.updateToken(token);
            else initBee(token);
          });
        }
      }
    };

    // ─── Auth + Init ──────────────────────────────────────────────────────────
    let bee = null;

    async function getBeeToken(callback) {
      try {
        const res = await fetch('http://localhost:3001/proxy/bee-auth', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ uid: 'form-builder-user' })
        });
        callback(await res.json());
      } catch (err) {
        console.error('Auth failed:', err);
      }
    }

    function initBee(token) {
      BeePlugin.create(token, beeConfig, instance => {
        bee = instance;
        bee.start({});
      });
    }

    getBeeToken(initBee);
  </script>

</body>
</html>
