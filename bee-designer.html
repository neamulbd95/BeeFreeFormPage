<!DOCTYPE html>
<html lang="en">

<head>
  <title>Beefree SDK — Form Designer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; overflow: hidden; background: #f5f5f5; }

    #bee-plugin-container {
      position: absolute;
      top: 5px; bottom: 5px; left: 5px; right: 5px;
    }

    /* ── Modal Overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }

    .modal {
      background: white;
      border-radius: 14px;
      width: 520px; max-width: 96vw;
      max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* ── Modal Header ── */
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #E2E8F0;
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-header h2 { font-size: 17px; font-weight: 700; color: #1E293B; }
    .modal-header p  { font-size: 12px; color: #94A3B8; margin-top: 3px; }

    .close-btn {
      background: none; border: none;
      width: 28px; height: 28px; border-radius: 6px;
      font-size: 17px; cursor: pointer; color: #94A3B8;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s; flex-shrink: 0;
    }
    .close-btn:hover { background: #F1F5F9; color: #475569; }

    /* ── Modal Body ── */
    .modal-body {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Select group */
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 11px; font-weight: 700; color: #64748B;
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); pointer-events: none;
      font-size: 13px; color: #64748B;
    }
    .form-select {
      width: 100%; padding: 10px 36px 10px 14px;
      border: 1.5px solid #E2E8F0; border-radius: 8px;
      font-size: 14px; color: #1E293B; outline: none;
      appearance: none; -webkit-appearance: none;
      font-family: 'Inter', sans-serif;
      background: white; cursor: pointer;
      transition: border-color 0.15s;
    }
    .form-select:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .form-select:disabled { background: #F8FAFC; color: #94A3B8; cursor: not-allowed; }

    /* Loading state inside select area */
    .select-loading {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border: 1.5px solid #E2E8F0; border-radius: 8px;
      font-size: 13px; color: #94A3B8;
    }

    /* Error banner */
    .error-banner {
      background: #FEF2F2; border: 1px solid #FECACA; border-radius: 8px;
      padding: 12px 14px; font-size: 13px; color: #DC2626;
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Form Preview ── */
    .preview-box {
      border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden;
    }
    .preview-header {
      padding: 10px 14px; background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .preview-header-left { display: flex; flex-direction: column; gap: 1px; }
    .preview-form-name { font-size: 13px; font-weight: 600; color: #1E293B; }
    .preview-form-desc { font-size: 11px; color: #94A3B8; }
    .preview-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      background: #EEF2FF; color: #6366F1; border-radius: 10px;
    }
    .preview-fields { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }

    .preview-field {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; background: white;
      border: 1px solid #F1F5F9; border-radius: 6px;
    }
    .preview-type {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
    }
    .type-text, .type-password { background: #EEF2FF; color: #6366F1; }
    .type-email                { background: #FEF3C7; color: #D97706; }
    .type-number               { background: #E0F2FE; color: #0284C7; }
    .type-textarea             { background: #F0FDF4; color: #16A34A; }
    .type-date                 { background: #CCFBF1; color: #0D9488; }
    .type-select, .type-radio  { background: #FDF4FF; color: #9333EA; }
    .type-submit               { background: #ECFDF5; color: #059669; }

    .preview-label { font-size: 13px; color: #374151; }
    .preview-required {
      font-size: 10px; color: #EF4444; font-weight: 600; margin-left: auto;
    }

    .preview-empty {
      padding: 20px 14px; text-align: center;
      font-size: 13px; color: #94A3B8;
    }

    .preview-meta {
      padding: 8px 14px; border-top: 1px solid #F1F5F9;
      font-size: 11px; color: #94A3B8;
      display: flex; gap: 12px;
    }
    .preview-meta span strong { color: #475569; }

    /* ── Manager link ── */
    .manager-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: #F8FAFC;
      border: 1px solid #E2E8F0; border-radius: 8px;
    }
    .manager-link-text { font-size: 12px; color: #64748B; }
    .manager-link a {
      font-size: 12px; font-weight: 600; color: #6366F1;
      text-decoration: none; display: flex; align-items: center; gap: 4px;
    }
    .manager-link a:hover { color: #4F46E5; text-decoration: underline; }

    /* ── No forms hint ── */
    .no-forms-hint {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 24px; text-align: center;
      background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 8px;
    }
    .no-forms-hint p { font-size: 13px; color: #92400E; }
    .no-forms-hint a {
      font-size: 13px; font-weight: 600; color: #6366F1; text-decoration: none;
    }
    .no-forms-hint a:hover { text-decoration: underline; }

    /* ── Modal Footer ── */
    .modal-footer {
      padding: 14px 24px; border-top: 1px solid #E2E8F0;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; background: white;
    }
    .footer-hint { font-size: 12px; color: #94A3B8; }

    .btn {
      padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.12s; border: none;
      font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-secondary { background: white; border: 1px solid #E2E8F0; color: #64748B; }
    .btn-secondary:hover { border-color: #94A3B8; color: #374151; }
    .btn-primary { background: #6366F1; color: white; }
    .btn-primary:hover { background: #4F46E5; }
    .btn-primary:disabled { background: #A5B4FC; cursor: not-allowed; }

    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: white;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  </style>
</head>

<body>

  <div id="bee-plugin-container"></div>

  <!-- ── Form Picker Modal ── -->
  <div id="picker-modal" class="modal-overlay" style="display:none">
    <div class="modal">

      <div class="modal-header">
        <div>
          <h2>Design Form</h2>
          <p>Select a saved form to render it in the designer</p>
        </div>
        <button class="close-btn" onclick="cancelPicker()" title="Cancel">✕</button>
      </div>

      <div class="modal-body">

        <!-- Form select -->
        <div class="field-group">
          <label class="field-label">Saved Form</label>
          <div id="select-area">
            <div class="select-loading">
              <span class="spinner" style="border-top-color:#6366F1;border-color:#E2E8F0;border-top-color:#6366F1;"></span>
              Loading forms…
            </div>
          </div>
        </div>

        <!-- Preview (shown after selection) -->
        <div id="preview-section" style="display:none">
          <div class="field-group">
            <label class="field-label">Fields Preview</label>
            <div class="preview-box">
              <div class="preview-header">
                <div class="preview-header-left">
                  <span class="preview-form-name" id="preview-title">—</span>
                  <span class="preview-form-desc" id="preview-desc"></span>
                </div>
                <span class="preview-badge" id="preview-badge">0 fields</span>
              </div>
              <div class="preview-fields" id="preview-fields"></div>
              <div class="preview-meta" id="preview-meta"></div>
            </div>
          </div>
        </div>

        <!-- No forms hint (shown when list is empty) -->
        <div id="no-forms-hint" class="no-forms-hint" style="display:none">
          <p>No saved forms found.<br/>Create a form in the Form Manager first.</p>
          <a href="form-manager.html" target="_blank">Open Form Manager ↗</a>
        </div>

        <!-- Divider + manager link -->
        <div class="manager-link">
          <span class="manager-link-text">Need to create or edit a form?</span>
          <a href="form-manager.html" target="_blank">Open Form Manager ↗</a>
        </div>

      </div>

      <div class="modal-footer">
        <span class="footer-hint" id="footer-hint">Choose a form from the dropdown above</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="cancelPicker()">Cancel</button>
          <button class="btn btn-primary" id="load-btn" onclick="loadSelectedForm()" disabled>
            Load into Designer
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://app-rsrc.getbee.io/plugin/BeePlugin.js"></script>
  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let resolveForm = null;
    let rejectForm  = null;
    let savedForms  = [];
    let bee         = null;

    // ─── Utils ────────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ─── Open picker modal ────────────────────────────────────────────────────
    // Called by Beefree's contentDialog.manageForm handler
    async function openPicker(resolve, reject) {
      resolveForm = resolve;
      rejectForm  = reject;

      // Reset UI
      document.getElementById('preview-section').style.display  = 'none';
      document.getElementById('no-forms-hint').style.display    = 'none';
      document.getElementById('load-btn').disabled              = true;
      document.getElementById('footer-hint').textContent        = 'Choose a form from the dropdown above';
      document.getElementById('select-area').innerHTML          = `
        <div class="select-loading">
          <span class="spinner" style="border-color:#E2E8F0;border-top-color:#6366F1;"></span>
          Loading forms…
        </div>`;

      document.getElementById('picker-modal').style.display = 'flex';

      // Fetch saved forms
      try {
        const res  = await fetch('http://localhost:3001/api/forms');
        const data = await res.json();
        savedForms = data.forms || [];
        renderSelect();
      } catch {
        document.getElementById('select-area').innerHTML = `
          <div class="error-banner">
            ⚠️ Could not reach the server — is proxy-server.js running on port 3001?
          </div>`;
      }
    }

    // ─── Render the select dropdown ───────────────────────────────────────────
    function renderSelect() {
      if (savedForms.length === 0) {
        document.getElementById('select-area').innerHTML = `
          <select class="form-select" disabled>
            <option>No saved forms found</option>
          </select>`;
        document.getElementById('no-forms-hint').style.display = 'flex';
        return;
      }

      const options = savedForms.map(f => `
        <option value="${esc(f.formId)}">${esc(f.title)}</option>
      `).join('');

      document.getElementById('select-area').innerHTML = `
        <div class="select-wrap">
          <select class="form-select" id="form-select" onchange="onSelectChange()">
            <option value="">— Choose a saved form —</option>
            ${options}
          </select>
        </div>`;
    }

    // ─── Handle form selection ────────────────────────────────────────────────
    function onSelectChange() {
      const select  = document.getElementById('form-select');
      const formId  = select.value;
      const loadBtn = document.getElementById('load-btn');

      if (!formId) {
        document.getElementById('preview-section').style.display = 'none';
        document.getElementById('footer-hint').textContent       = 'Choose a form from the dropdown above';
        loadBtn.disabled = true;
        return;
      }

      const form = savedForms.find(f => f.formId === formId);
      if (!form) return;

      // Populate preview
      document.getElementById('preview-title').textContent = form.title || 'Untitled';
      document.getElementById('preview-desc').textContent  = form.description || '';

      const visibleFields = (form.fieldMeta || []).filter(m => m.type !== 'hidden' && m.type !== 'submit');
      const submitField   = (form.fieldMeta || []).find(m => m.type === 'submit');

      document.getElementById('preview-badge').textContent =
        visibleFields.length + (visibleFields.length === 1 ? ' field' : ' fields');

      const fieldsHtml = visibleFields.length
        ? visibleFields.map(f => `
            <div class="preview-field">
              <span class="preview-type type-${esc(f.type)}">${esc(f.type)}</span>
              <span class="preview-label">${esc(f.label)}</span>
            </div>`).join('')
        : '<div class="preview-empty">No input fields found in this form.</div>';

      document.getElementById('preview-fields').innerHTML = fieldsHtml;

      const subs = form.submissionCount || 0;
      document.getElementById('preview-meta').innerHTML = `
        <span><strong>${subs}</strong> submission${subs !== 1 ? 's' : ''}</span>
        ${submitField ? `<span>Submit button: <strong>${esc(submitField.label || 'Submit')}</strong></span>` : ''}`;

      document.getElementById('preview-section').style.display = 'block';
      document.getElementById('footer-hint').textContent       = `"${form.title}" selected`;
      loadBtn.disabled = false;
    }

    // ─── Load the selected form into Beefree ──────────────────────────────────
    async function loadSelectedForm() {
      const select = document.getElementById('form-select');
      const formId = select ? select.value : '';
      if (!formId) return;

      const btn = document.getElementById('load-btn');
      btn.innerHTML = '<span class="spinner"></span> Loading…';
      btn.disabled  = true;

      try {
        const res  = await fetch(`http://localhost:3001/api/forms/${formId}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const form = await res.json();

        const structure = buildBeeStructure(form);

        if (resolveForm) {
          resolveForm(structure);
          resolveForm = null;
          rejectForm  = null;
        }
        document.getElementById('picker-modal').style.display = 'none';
      } catch (err) {
        console.error(err);
        document.getElementById('footer-hint').textContent = '⚠️ Failed to load form data — please try again.';
      } finally {
        btn.innerHTML = 'Load into Designer';
        btn.disabled  = false;
      }
    }

    // ─── Cancel ───────────────────────────────────────────────────────────────
    function cancelPicker() {
      if (rejectForm) {
        rejectForm();
        resolveForm = null;
        rejectForm  = null;
      }
      document.getElementById('picker-modal').style.display = 'none';
    }

    // ─── Build Beefree form structure from stored form data ───────────────────
    // Uses fieldDefs (full definitions) when available, falls back to fieldMeta.
    function buildBeeStructure(form) {
      const fields = {};
      const layout = [];

      // Embed a hidden form_id so every submission is traceable
      fields['form_id'] = {
        type:                   'hidden',
        label:                  '',
        removeFromLayout:       false,
        canBeRemovedFromLayout: false,
        canBeModified:          false,
        attributes:             { name: 'form_id', value: form.formId },
      };
      layout.push(['form_id']);

      const defs = form.fieldDefs && form.fieldDefs.length
        ? form.fieldDefs
        : (form.fieldMeta || []).map(m => ({
            id:         m.id,
            type:       m.type,
            label:      m.label,
            attributes: {},
          }));

      defs.forEach(f => {
        const def = {
          type:                   f.type,
          label:                  f.label || '',
          canBeRemovedFromLayout: false,
          removeFromLayout:       false,
          canBeModified:          false,
          attributes:             { ...(f.attributes || {}) },
        };
        if (f.options) def.options = f.options.map(o => ({ ...o }));
        fields[f.id] = def;
        layout.push([f.id]);
      });

      return {
        structure: {
          title:       form.title       || '',
          description: form.description || '',
          fields,
          layout,
          attributes: {
            'accept-charset': 'UTF-8',
            action:           'http://localhost:3001/api/form-submit',
            autocomplete:     'on',
            enctype:          'application/x-www-form-urlencoded',
            method:           'post',
            novalidate:       false,
            target:           '_self',
          },
        },
      };
    }

    // ─── Beefree config ───────────────────────────────────────────────────────
    const beeConfig = {
      container:    'bee-plugin-container',
      language:     'en-US',
      trackChanges: true,

      contentDialog: {
        manageForm: {
          label: 'Design Form',
          handler: (resolve, reject, _args) => {
            openPicker(resolve, reject);
          },
        },
      },

      onChange: (jsonFile) => {
        localStorage.setItem('bee-designer.autosave', jsonFile);
      },
      onSave: (jsonFile, htmlFile) => {
        const a = Object.assign(document.createElement('a'), {
          href:     URL.createObjectURL(new Blob([htmlFile], { type: 'text/html' })),
          download: 'form-page.html',
        });
        a.click();
      },
      onSaveAsTemplate: (jsonFile) => {
        const a = Object.assign(document.createElement('a'), {
          href:     URL.createObjectURL(new Blob([jsonFile], { type: 'application/json' })),
          download: 'form-template.json',
        });
        a.click();
      },
      onAutoSave: (jsonFile) => {
        localStorage.setItem('bee-designer.autosave', jsonFile);
      },
      onError: (error) => {
        console.error('Bee error:', error);
        if (error.code === 5101 || error.code === 5102) {
          getBeeToken(token => {
            if (error.code === 5101) bee.updateToken(token);
            else initBee(token);
          });
        }
      },
    };

    // ─── Auth + Init ──────────────────────────────────────────────────────────
    async function getBeeToken(callback) {
      try {
        const res = await fetch('http://localhost:3001/proxy/bee-auth', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ uid: 'bee-designer-user' }),
        });
        callback(await res.json());
      } catch (err) {
        console.error('Auth failed:', err);
      }
    }

    function initBee(token) {
      BeePlugin.create(token, beeConfig, instance => {
        bee = instance;
        fetch('./template.json')
          .then(r => r.json())
          .then(t => bee.start(t))
          .catch(() => bee.start({}));
      });
    }

    getBeeToken(initBee);
  </script>

</body>
</html>
